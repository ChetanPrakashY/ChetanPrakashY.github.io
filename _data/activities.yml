sections:
  - title: Naxatra · Astronomy & Cosmology Club
    role: Coordinator
    dates: June 2024 – September 2025
    text: >-
      As coordinator of Naxatra, IISER Berhampur's astronomy and cosmology club,
      I organised telescope demonstrations, talks and outreach events for the
      campus community.


      The largest event was an **X-ray astronomy data-analysis workshop** that I
      led. It drew **330 students from across India** and brought in invited
      speakers from the field.
    photos:
      - image: /assets/img/activities/naxatra-telescope.jpg
        caption: Demonstrating a telescope
      - image: /assets/img/activities/naxatra-intro.jpg
        caption: Club outreach
      - image: /assets/img/activities/naxatra-talk.jpg
        caption: A Naxatra talk
  - title: Lovelace Society · Tech Society
    role: Co-coordinator
    dates: January 2024 – June 2025
    text: The Lovelace Society promotes coding and shows how programming is used
      across the sciences. I helped run hackathons and weekly programming
      workshops for students across disciplines.
    photos:
      - image: /assets/img/activities/lovelace-robots.jpg
        caption: Arduino robots, an obstacle avoider and a line follower
      - image: /assets/img/activities/lovelace-logo.jpg
        caption: The Lovelace Society
  - title: Science communication & outreach
    text: >+
      - **STREAM outreach programme.** I taught school students the basics of
      astronomy and how telescopes work, and designed interactive activities
      about space science.

      - **Episteme science magazine.** I wrote articles for IISER Berhampur's
      student science magazine and worked with the technical team that runs its
      website.

      - **Invenio science fest.** I organised events for IISER Berhampur's
      annual science fest.

      - **Trieste Next 2026.** At SISSA's stall at Trieste's science festival, I
      explained the Fourier transform and gravitational waves to the public.

      - **Research talks.** I have presented papers and given talks on my ongoing
      research at IISER Berhampur.

      - **Mentoring.** I mentor undergraduates as they find their way through
      college life and into a field of interest.

    photos:
      - image: /assets/img/activities/outreach-gw-talk.jpg
        caption: Talk on gravitational waves
      - image: /assets/img/activities/outreach-mentoring.jpg
        caption: Mentoring program
      - image: /assets/img/activities/outreach-gyroscope.jpg
        caption: Explaining a gyroscope to school kids
  - title: Beyond physics
    text: I play lawn tennis and represented IISER Berhampur at the Inter-IISER
      Sports Meet (December 2023, 2024, 2025). I also enjoy basketball, trekking, painting,
      reading and writing.
    photos:
      - image: /assets/img/activities/tennis.jpg
        caption: On the tennis court
      - image: /assets/img/activities/trekking.jpg
        caption: Trekking
