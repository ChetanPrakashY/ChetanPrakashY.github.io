        location: Kumamoto, Japan (remote)
        start_date: 2026-01
        end_date: present
        highlights:
          - Developing an analytic theory of how precise pulsar distances improve sky localization of individual gravitational-wave sources with pulsar timing arrays (PTAs).

      - company: Nicolaus Copernicus Astronomical Center (CAMK) and IUCAA
        position: Research collaboration (with Dr. Sreekanth Harikumar and Dr. Apratim Ganguly)
        location: Warsaw, Poland / Pune, India (remote)
        start_date: 2026-05
        end_date: present
        highlights:
          - Studying lensing effects on nHz gravitational waves and their impact on the PTA Hellings–Downs curve.

      - company: Indian Institute of Technology Tirupati
        position: Research collaboration (with Dr. Vikram Khaire)
        location: Tirupati, India
        start_date: 2025-07
        end_date: present
        highlights:
          - Panchromatic free-retrieval analysis of the warm Neptune WASP-107b, including the heterogeneous surface of its active K-dwarf host; paper in preparation.
          - Investigating biosignatures on exoplanets using transit spectroscopy.

      - company: Tata Institute of Fundamental Research (TIFR)
        position: Research intern (advisor Prof. A. Gopakumar)
        location: Mumbai, India
        start_date: 2025-05
        end_date: 2025-09
        highlights:
          - Independently derived the 1.5PN spin–orbit quasi-Keplerian solution for hyperbolic encounters.

      - company: Inter-University Centre for Astronomy and Astrophysics (IUCAA)
        position: Research intern (advisor Dr. Anupreeta More)
        location: Pune, India
        start_date: 2024-05
        end_date: 2024-08
        highlights:
          - Analysed the tidal deformability of coalescing neutron stars under gravitational microlensing, and tested waveform fitting factors in parameter estimation.

      - company: Tata Institute of Fundamental Research (TIFR)
        position: Group project intern (advisor Dr. Shadab Alam)
        location: Mumbai, India
        start_date: 2024-05
        end_date: 2024-08
        highlights:
          - Studied galaxy clustering through the projected correlation function.

