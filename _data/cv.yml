    Leadership and Activities:
      - bullet: "**Coordinator, Naxatra** (Astronomy & Cosmology Club, IISER Berhampur), June 2024 – September 2025. Organised telescope demonstrations, talks and outreach events, and led an X-ray astronomy data-analysis workshop attended by 330 students from across India, with invited speakers from the field."
      - bullet: "**Co-coordinator, Lovelace Society** (Tech Society, IISER Berhampur), January 2024 – June 2025. Promoted coding and its use across scientific disciplines; ran hackathons and weekly programming workshops."
      - bullet: "**Episteme** (student science magazine, IISER Berhampur). Wrote articles and worked with the technical team on the magazine website and its online publication."

    Talks and Outreach:
      - bullet: Presented papers and gave talks on my ongoing research at IISER Berhampur.
      - bullet: "**Trieste Next 2026** (SISSA): explained the Fourier transform and gravitational waves to the public at SISSA's stall at Trieste's science festival."
      - bullet: Taught school students the basics of astronomy and how telescopes work during the STREAM outreach programme of IISER Berhampur, and designed interactive space-science activities.
      - bullet: Organised events for Invenio, the annual science fest of IISER Berhampur.
      - bullet: Mentored undergraduates in navigating college life and finding their field of interest.

